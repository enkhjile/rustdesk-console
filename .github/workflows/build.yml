name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    paths:
      - ".github/workflows/build.yml"
      - "Dockerfile.release"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  webui:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Build admin web UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
      - uses: actions/upload-artifact@v4
        with:
          name: admin-dist
          path: resources/admin

  native:
    needs: webui
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    env:
      CC_x86_64_unknown_linux_musl: musl-gcc
      CC_aarch64_unknown_linux_musl: musl-gcc
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
      - name: Install native musl compiler
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - name: Pull in admin UI
        uses: actions/download-artifact@v4
        with:
          name: admin-dist
          path: resources/admin
      - name: Build release binary once
        run: cargo build --locked --release --target ${{ matrix.target }} -p rustdesk-console
      - name: Package binary and image context
        run: |
          mkdir -p release/data release/runtime
          cp target/${{ matrix.target }}/release/rustdesk-console release/
          cp -r conf release/
          tar -C release -czf rustdesk-console-${{ matrix.target }}.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: rustdesk-console-${{ matrix.target }}
          path: rustdesk-console-${{ matrix.target }}.tar.gz
      - uses: docker/setup-buildx-action@v3
      - name: Build runtime image
        uses: docker/build-push-action@v6
        with:
          context: release
          file: Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: console-smoke:local
          cache-from: type=gha,scope=console-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=console-runtime-${{ matrix.arch }}
      - name: Smoke-test native image and embedded UI
        run: |
          docker run -d --name console-smoke -p 127.0.0.1:21114:21114 console-smoke:local
          trap 'docker logs console-smoke; docker rm -fv console-smoke' EXIT
          curl --fail --retry 30 --retry-connrefused --retry-delay 1 --max-time 5 http://127.0.0.1:21114/health
          curl --fail --max-time 5 http://127.0.0.1:21114/_admin/ | grep -q 'id="root"'
      - name: Log in to GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push tested image by digest
        id: push
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/build-push-action@v6
        with:
          context: release
          file: Dockerfile.release
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true,name-canonical=true,push=true
      - name: Record digest
        if: startsWith(github.ref, 'refs/tags/')
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    needs: native
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish multi-platform manifest
        working-directory: digests
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          VERSION: ${{ github.ref_name }}
        run: |
          tags=(--tag "$IMAGE:$VERSION")
          if [[ "$VERSION" != *-* ]]; then tags+=(--tag "$IMAGE:latest"); fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          test "${#sources[@]}" -eq 2
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
