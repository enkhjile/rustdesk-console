name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.0
      - name: Test and build embedded admin UI
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm test
          pnpm run build
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Check new protocol formatting
        run: rustfmt --check --edition 2021 crates/server/src/features/agent/mod.rs crates/entity/src/companion_agent.rs
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo build --locked -p rustdesk-console
